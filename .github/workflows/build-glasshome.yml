name: Build Glass Home

on:
  push:
    paths: ["glasshome/**", ".github/workflows/build-glasshome.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glasshome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Lint (errors only)
        run: ./gradlew --no-daemon lintDebug || true
      - uses: actions/upload-artifact@v4
        with:
          name: glasshome-apk
          path: glasshome/app/build/outputs/apk/debug/app-debug.apk
